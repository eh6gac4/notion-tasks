  </defs>

  <rect width="176" height="176" fill="url(#field)"/>
  <rect width="176" height="176" fill="url(#dots)"/>
  <rect width="176" height="176" fill="url(#glow)"/>

  <!-- 封筒 + チェック(タスク + メール) -->
