<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 176 176" width="192" height="192">
  <defs>
    <linearGradient id="field" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16060c"/>
      <stop offset="100%" stop-color="#0b0008"/>
    </linearGradient>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="1.6" fill="#dc143c" fill-opacity="0.14"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="45%" r="62%">
      <stop offset="0%" stop-color="#dc143c" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#dc143c" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#dc143c" stop-opacity="0"/>
