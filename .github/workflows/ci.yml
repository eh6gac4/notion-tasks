name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同一ブランチの古い実行はキャンセルする。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      visual: ${{ steps.filter.outputs.visual }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # 視覚回帰は毎回 Playwright コンテナ (914MB) を pull する。描画に関わる
          # 変更があったときだけ visual ジョブを走らせて pull 回数を減らす。
          filters: |
            visual:
              - 'src/**'
              - 'public/**'
              - 'e2e/snapshot.spec.ts'
              - 'e2e/helpers.ts'
              - 'e2e/auth.setup.ts'
              - 'e2e/snapshots/**'
              - 'playwright.config.ts'
              - 'next.config.ts'
              - 'postcss.config.mjs'
              - 'scripts/visual-regression.sh'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'

  unit:
    name: Unit tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node:sqlite (fakeD1) を使うため Node 22 必須。
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: Run Playwright
        run: npm run test
        env:
          # playwright.config.ts の webServer は CI で `npm run dev` を起動する。
          # dev サーバー(照合側)と auth.setup.ts(入力側)の両方がこの値を読む。
          APP_USERNAME: ci-user
          APP_PASSWORD: ci-pass
          NEXTAUTH_SECRET: ci-playwright-not-a-real-secret
          AUTH_SECRET: ci-playwright-not-a-real-secret
          NEXTAUTH_URL: http://localhost:3000
          # 視覚回帰は runner 上だと描画が baseline と一致しないため専用の visual ジョブに任せる。
          SKIP_VISUAL: "1"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  visual:
    name: Visual regression (Playwright container)
    needs: changes
    if: needs.changes.outputs.visual == 'true'
    runs-on: ubuntu-latest
    # コンテナ image (914MB) は毎回 pull する（約 36s）。docker save + actions/cache は
    # 3.4GB tar の load が pull より遅く、10GB のキャッシュ枠を圧迫して e2e ジョブの
    # browsers キャッシュを追い出すため採用しない。実行頻度を changes ジョブで絞る方針。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # baseline は Playwright 公式コンテナで撮影されている (scripts/visual-regression.sh)。
      # 同じコンテナ内で照合することで描画差分をなくす。
      - name: Run visual regression
        run: bash scripts/visual-regression.sh
        env:
          APP_USERNAME: ci-user
          APP_PASSWORD: ci-pass
          NEXTAUTH_SECRET: ci-playwright-not-a-real-secret
          AUTH_SECRET: ci-playwright-not-a-real-secret
          NEXTAUTH_URL: http://localhost:3000

      - name: Upload diff report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report
          path: playwright-report/
          retention-days: 7

  sw-smoke:
    name: Service Worker smoke (prod build)
    runs-on: ubuntu-latest
    env:
      # config.ts の requireEnv を通すためのダミー値。next build / next start は
      # ルートを実行しないため実際の値は不要。
      NOTION_TOKEN: dummy
      NOTION_DATABASE_ID: dummy
      GOOGLE_CLIENT_ID: dummy
      GOOGLE_CLIENT_SECRET: dummy
      APP_USERNAME: ci-user
      APP_PASSWORD: ci-pass
      NEXTAUTH_SECRET: ci-not-a-real-secret
      AUTH_SECRET: ci-not-a-real-secret
      NEXTAUTH_URL: http://localhost:3123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (next build --webpack)
        run: npm run build
      - name: Smoke test /sw.js
        run: bash scripts/sw-smoke.sh
